name = "nyc-delivery-orders"
main = "src/index.js"
compatibility_date = "2026-09-01"
# Workers 免费档：10 万请求/天、10ms CPU、128MB。够小店用（店里设备每 3 秒拉一次 ≈ 2.9 万/天）

[[d1_databases]]
binding = "DB"
database_name = "nyc-orders"
database_id = "本地开发用占位；线上先在 Cloudflare 建库再填真实 id"
# 建库：wrangler d1 create nyc-orders  → 把返回的 database_id 贴到这里
# 初始化：wrangler d1 execute nyc-orders --file=./schema.sql --local     (本地)
#         wrangler d1 execute nyc-orders --file=./schema.sql --remote    (线上)

[vars]
AGENT_KEY = "dev-key-change-me"
# 线上务必改成密钥：wrangler secret put AGENT_KEY

[observability]
enabled = true
