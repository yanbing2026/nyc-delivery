name = "nyc-delivery-orders"
main = "src/index.js"
compatibility_date = "2026-09-01"
# Workers 免费档：10 万请求/天、10ms CPU、128MB。够小店用（店里设备每 3 秒拉一次 ≈ 2.9 万/天）

[[d1_databases]]
binding = "DB"
database_name = "nyc-orders"
database_id = "eb9efcec-aa07-47e7-b9db-267fd82c823d"
# 线上库已建（2026-09-16，账户 259f65f4abbe1ea7c7de106d9614a82b，区域 ENAM）
# schema 已应用：orders / settings / hits + 3 索引 + 默认 delivery 配置
# 重新初始化：wrangler d1 execute nyc-orders --file=./schema.sql --remote
# 注意 schema.sql 开头是 DROP TABLE IF EXISTS —— 有真实订单后别再无脑重跑

# AGENT_KEY 走线上密钥，不写在配置里（wrangler secret put AGENT_KEY）
# 同名 var 和 secret 同时存在会让 wrangler 报错，所以这里不保留占位值

[observability]
enabled = true
