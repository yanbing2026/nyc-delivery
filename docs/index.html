<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>在线点单 · 到店自取</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--line:#e4e7ec;--fg:#111;--dim:#6b7280;--pri:#c8321f;--ok:#15803d;--warn:#b45309}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:104px}
header{background:var(--pri);color:#fff;padding:14px}
header h1{margin:0;font-size:19px}header .d{font-size:12px;opacity:.92;margin-top:2px}
.seg{display:flex;gap:8px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line)}
.seg button{flex:1;min-height:46px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:15px;font-weight:600;color:var(--fg)}
.seg button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.cat{font-size:13px;color:var(--dim);padding:12px 14px 4px;font-weight:600}
.item{background:var(--card);display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.item .n{flex:1}.item .n b{display:block;font-size:16px}.item .n span{font-size:12px;color:var(--dim)}
.price{color:var(--pri);font-weight:700;min-width:62px;text-align:right}
.step{display:flex;align-items:center;gap:6px}
.step button{width:44px;height:44px;border-radius:50%;border:1px solid var(--pri);background:#fff;color:var(--pri);font-size:22px;line-height:1}
.step button.plus{background:var(--pri);color:#fff}
.step span{min-width:26px;text-align:center;font-weight:600}
.block{background:var(--card);padding:12px 14px;border-top:8px solid var(--bg)}
label{display:block;font-size:13px;color:var(--dim);margin:10px 0 6px}
input,textarea{width:100%;min-height:46px;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff;color:var(--fg)}
.hint{font-size:12px;color:var(--dim);margin-top:4px}
/* 老客取回块：和表单同宽，视觉上是个"辅助入口"，不抢主角 */
.recall{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0}
.recall .rh{font-size:13px;color:var(--dim);margin-bottom:6px}
.recall button{border-radius:10px;border:1px solid var(--line);background:#fff;font-size:15px;font-weight:600;color:var(--fg);min-height:46px}
.tips{display:flex;gap:8px;flex-wrap:wrap}
.tips button{min-height:46px;flex:1;min-width:76px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:15px}
.tips button.on{background:#111;color:#fff;border-color:#111}
#quote{background:#fffdf5;border:1px dashed #e0d9c0;border-radius:12px;padding:12px;margin-top:12px;font-size:15px}
#quote .r{display:flex;justify-content:space-between;padding:3px 0}
#quote .r.tot{border-top:1px solid #e0d9c0;margin-top:6px;padding-top:8px;font-weight:700;font-size:18px}
#quote .r.tot span:last-child{color:var(--pri)}
.msg{padding:10px 12px;border-radius:10px;font-size:14px;margin-top:10px}
.msg.err{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.msg.warn{background:#fffbeb;color:var(--warn);border:1px solid #fde68a}
.cash{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;border-radius:10px;padding:10px 12px;font-size:14px;margin-top:6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center}
.bar .tot{flex:1;font-size:14px}.bar .tot b{color:var(--pri);font-size:20px}
.bar button{min-height:52px;padding:0 20px;border:0;border-radius:12px;background:var(--pri);color:#fff;font-size:16px;font-weight:700}
.bar button:disabled{background:#c9ccd1}
#done{position:fixed;inset:0;background:#fff;display:none;flex-direction:column;padding:18px;overflow:auto}
#done.show{display:flex}
#done h2{color:var(--ok);margin:8px 0}
#done .rcpt{background:#fffdf5;border:1px dashed var(--line);border-radius:10px;padding:12px;overflow:auto}
#done pre{font:12px/1.45 ui-monospace,Menlo,monospace;white-space:pre;margin:0}
#done .big{font-size:20px;font-weight:700;margin:6px 0}
#done button{margin-top:14px;min-height:50px;border:0;border-radius:12px;background:var(--pri);color:#fff;font-size:16px;font-weight:600}
details{background:var(--card);border-top:8px solid var(--bg);padding:10px 14px}
summary{font-size:14px;color:var(--dim)}
</style>
</head>
<body>
<header>
  <h1 id="shopName">在线点单</h1>
  <div class="d" id="shopLine">纽约 · 到店自取 · 现金支付</div>
</header>

<div id="menu"></div>

<!-- 店员/调试信息：顾客看不到。默认隐藏，只有页面地址带 ?debug=1 或
     localStorage 里 wxmenu_debug=1 时才显示（店址、配送费规则属于店里配置，
     不该摆给客人看；日常改配置在菜单编辑页）。 -->
<details id="devBox" style="display:none">
  <summary>⚙️ 店员信息（店址 / 配送费规则，只读）</summary>
  <div class="hint" id="shopHint">正在读后端配置…</div>
</details>

<div class="block">
  <!-- 自取导航块：地图 + 跳转到顾客手机自带的地图 App -->
  <div class="recall">
    <div class="rh">📍 怎么来取？</div>
    <div class="hint" id="pickupAddr">店址加载中…</div>
    <div id="mapBox"></div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button type="button" id="navApple" style="flex:1;min-height:46px;border-radius:10px;border:1px solid var(--line);background:#111;color:#fff;font-size:15px;font-weight:600">🧭 Apple 地图导航</button>
      <button type="button" id="navGoogle" style="flex:1;min-height:46px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:15px;font-weight:600">🗺️ Google 地图导航</button>
    </div>
    <div class="hint">导航会打开你手机自带的地图 App（跳到你自己的地图里开始路线）。</div>
  </div>

  <!-- 老客取回：输手机号带出上次的姓名/电话（不上验证，见 INSTRUCTIONS 的隐私说明） -->
  <div class="recall">
    <div class="rh">老客？输手机号带出上次的资料</div>
    <div style="display:flex;gap:8px">
      <input id="rp" type="tel" placeholder="917-555-0123" style="flex:1">
      <button type="button" id="rbtn" style="padding:0 16px">取回</button>
    </div>
    <div class="hint" id="rmsg"></div>
    <div id="rlast"></div>
  </div>

  <label>姓名</label><input id="cust" placeholder="例：张先生 / Mr. Zhang">
  <label>电话</label><input id="phone" type="tel" placeholder="917-555-0123">
  <label>备注</label><textarea id="remark" rows="2"></textarea>
  <label>小费</label><div class="tips" id="tips"></div>
  <label>支付方式</label>
  <div class="cash">💵 现金 Cash（到店付）—— 目前只收现金，请备好零钱</div>
  <div id="msgs"></div>
  <div id="quote"></div>
</div>

<div class="bar">
  <div class="tot">合计 <b id="tot">$0.00</b><br><span class="hint" id="barHint">还没选菜</span></div>
  <button id="submit" disabled>下单</button>
</div>

<div id="done">
  <h2>✅ 下单成功</h2>
  <div class="dim" id="doneMsg"></div>
  <div class="big" id="doneNo"></div>
  <div class="rcpt"><pre id="doneRcpt"></pre></div>
  <button onclick="location.reload()">再点一单</button>
</div>

<script src="./wxmenu.js"></script>
<!-- 不再引入本地里程模块：地址解析/时长/运费全部由后端算（/api/quote 会带回 address_check） -->
<script>
const $=id=>document.getElementById(id);
const PAY_DEFAULT='现金 Cash（送到付）';
// 下面这份菜单和店名只是"后端读不到时"的兜底（离线预览用）。
// 线上跑的时候，店名/电话/菜名/价格全都从后端配置读（菜单编辑页改，页面自动跟着变）。
let MENU=[
  {name:'招牌',items:[{id:'a1',name:'海蛎煎',en:'Oyster Omelette',desc:'现点现做',price:12.95},
   {id:'a2',name:'红蟳米糕',en:'Steamed Rice w/ Crab',desc:'',price:32.95},
   {id:'a3',name:'福州鱼丸汤',en:'Fuzhou Fish Ball Soup',desc:'',price:9.95}]},
 {name:'小炒',items:[{id:'b1',name:'荔枝肉',en:'Lychee Pork',desc:'福州味',price:14.95},
   {id:'b2',name:'糟菜炒粉干',en:'Rice Noodle w/ Pickled Veg',desc:'',price:12.95},
   {id:'b3',name:'白灼虾',en:'Boiled Shrimp',desc:'按份',price:19.95},
   {id:'b4',name:'蒜蓉炒青菜',en:'Chinese Broccoli',desc:'',price:11.95}]},
 {name:'主食 / 汤',items:[{id:'c1',name:'锅边糊',en:'Rice Noodle Soup',desc:'',price:8.95},
   {id:'c2',name:'福州拌面',en:'Fuzhou Lo Mein',desc:'',price:9.95},
   {id:'c3',name:'白饭',en:'Steamed Rice',desc:'',price:2.0}]},
 {name:'饮品',items:[{id:'d1',name:'茉莉花茶',en:'Jasmine Tea',desc:'一壶',price:3.95},
   {id:'d2',name:'王老吉',en:'Herbal Tea',desc:'',price:2.5}]}
];
let SHOP={name:'福州小馆',phone:'917-555-0123',slogan:'现点现做 · 法拉盛 30 分钟送达'};
// 运费一律由后端算；默认就指向线上 Worker，本地调试时用 localStorage('wxmenu_backend') 覆盖
const DEFAULT_BACKEND='https://nyc-delivery-orders.yanbing2004.workers.dev';
let cart={},pickup=true,tipRate=0,Q=null,acTimer=null,cfg=null,backend=(localStorage.getItem('wxmenu_backend')||DEFAULT_BACKEND).replace(/\/$/,'');
// 缺字段一律显示 —（以前 Number(v||0) 会把 undefined 变成 $0.00，
// 顾客看到"合计 $0.00"会以为页坏了）
const money=v=>Number.isFinite(+v)?'$'+(+v).toFixed(2):'—';
const subtotal=()=>Math.round(MENU.reduce((s,g)=>s+g.items.reduce((t,it)=>t+(cart[it.id]||0)*it.price,0),0)*100)/100;
const count=()=>Object.values(cart).reduce((a,b)=>a+b,0);

async function boot(){
  $('shopName').textContent=SHOP.name;
  applyDevVisibility();
  renderTips();renderMenu();
  if(!backend){
    $('shopLine').textContent=`${SHOP.phone} · 暂时无法接单`;
    $('shopHint').innerHTML='未连接后端：运费由店里服务器计算，请在菜单编辑页填上后端地址';
    msg('err','暂时连不上店里服务器，请稍后再试，或直接打电话订餐。');
    refresh(); return;
  }
  await reloadConfig();
  renderMenu();
  refresh();
}
// 顾客页面默认不显示店址/配送费规则；调试时地址栏加 ?debug=1 即可看到
function applyDevVisibility(){
  const on=(typeof location!=='undefined'&&/[?&]debug=1/.test(location.search||''))
    ||localStorage.getItem('wxmenu_debug')==='1';
  const box=$('devBox'); if(box) box.style.display=on?'':'none';
}
async function reloadConfig(){
  try{
    const c=await fetch(backend+'/api/config').then(r=>r.json());
    cfg=c.config;
    // 店名/电话/菜单由后端给（这里是唯一来源，页面里那份只是兜底）
    if(c.shop&&c.shop.name) SHOP={...SHOP,...c.shop};
    if(Array.isArray(c.menu)&&c.menu.length){
      MENU=c.menu;
      // 菜单换了要把购物车里已经不存在的菜清掉，否则件数/合计会算进幽灵菜
      for(const id of Object.keys(cart)) if(!MENU.some(g=>g.items.some(it=>it.id===id))) delete cart[id];
      renderMenu();
    }
    $('shopName').textContent=SHOP.name;
    document.title=`${SHOP.name} · 在线点单`;
    // 自取：店址 + 地图 + 导航按钮（导航不依赖坐标也成立，坐标有则用 destination 精确传）
    const rAddr=cfg.restaurant_addr||'';
    $('pickupAddr').textContent=rAddr?('店址：'+rAddr):'店址待店里发布菜单时更新';
    const geo=(cfg.restaurant&&Number.isFinite(+cfg.restaurant.lat)&&Number.isFinite(+cfg.restaurant.lon))?cfg.restaurant:null;
    const daddr=encodeURIComponent(rAddr);
    window.__nav=(os)=>{ if(!rAddr) return;
      const u=os==='g'
        ? (geo?`https://www.google.com/maps/dir/?api=1&destination=${geo.lat},${geo.lon}&destination_place_id=&travelmode=driving`:`https://www.google.com/maps/dir/?api=1&destination=${daddr}`)
        : (geo?`maps://?daddr=${geo.lat},${geo.lon}&dirflg=d`:`maps://?daddr=${daddr}&dirflg=d`);
      location.href=u; };
    $('navApple').onclick=()=>window.__nav('a');
    $('navGoogle').onclick=()=>window.__nav('g');
    // 内嵌小地图：Leaflet CDN，加载失败就静默跳过（按钮仍可用）
    const ml=document.createElement('link'); ml.rel='stylesheet';
    ml.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'; document.head.appendChild(ml);
    const ms=document.createElement('script'); ms.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'; ms.async=true;
    ms.onload=()=>{ if(!geo||!window.L||!document.getElementById('mapBox')) return;
      const map=L.map('mapBox',{zoomControl:false,attributionControl:false,scrollWheelZoom:false});
      map.setView([geo.lat,geo.lon],15);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
      L.circleMarker([geo.lat,geo.lon],{radius:9,color:'#c8321f',fillColor:'#c8321f',fillOpacity:1}).addTo(map);
      document.getElementById('mapBox').style.cssText='height:180px;border-radius:10px;border:1px solid var(--line);margin-top:8px';
    };
    document.head.appendChild(ms);
    $('shopLine').textContent=[SHOP.slogan,SHOP.phone,`起送 ${money(cfg.min_order)}`,'现金支付 · 到店自取'].filter(Boolean).join(' · ');
    renderTips();
    applyDevVisibility();
    $('shopHint').innerHTML=`✓ 店址：${cfg.restaurant_addr}<br>✓ 规则：${cfg.free_miles} 英里内免费 · 超出每英里 ${money(cfg.per_mile_beyond)}`
      +`${cfg.max_miles>0?` · 最远 ${cfg.max_miles} 英里`:' · 不设距离上限'}`;
  }catch(e){
    $('shopHint').innerHTML='⚠ 读不到后端配置：'+(e.message||e);
  }
}
function msg(k,t){ $('msgs').innerHTML=`<div class="msg ${k}">${t}</div>` }
function renderTips(){
  const opts=(cfg&&Array.isArray(cfg.tip_options)&&cfg.tip_options.length)?cfg.tip_options:[0.15,0.18,0.20];
  $('tips').innerHTML=opts.map(r=>`<button class="${tipRate===r?'on':''}" onclick="setTip(${r})">${r*100}%</button>`).join('')
    +`<button class="${tipRate===0?'on':''}" onclick="setTip(0)">不给</button>`
    +`<button onclick="setTip(-1)">自定</button>`;
}
function setTip(r){ if(r<0){tipRate=Math.min(0.5,Math.max(0,(parseFloat(prompt('小费百分比','20'))||0)/100));}else tipRate=r; renderTips(); refresh(); }
function renderMenu(){
  const box=$('menu'); box.innerHTML='';
  MENU.forEach(g=>{
    const h=document.createElement('div');h.className='cat';h.textContent=g.name;box.appendChild(h);
    g.items.forEach(it=>{
      const q=cart[it.id]||0,d=document.createElement('div');d.className='item';
      d.innerHTML=`<div class="n"><b>${it.name}</b><span>${it.en}${it.desc?' · '+it.desc:''}</span></div>
        <div class="price">${money(it.price)}</div>
        <div class="step"><button class="minus" ${q?'':'disabled'}>−</button><span>${q}</span><button class="plus">+</button></div>`;
      d.querySelector('.plus').onclick=()=>{cart[it.id]=(cart[it.id]||0)+1;renderMenu();refresh()};
      d.querySelector('.minus').onclick=()=>{cart[it.id]=Math.max(0,(cart[it.id]||0)-1);renderMenu();refresh()};
      box.appendChild(d);
    });
  });
}
const items=()=>{const o=[];MENU.forEach(g=>g.items.forEach(it=>{const q=cart[it.id]||0;if(q)o.push({name:it.name,qty:q,price:it.price})}));return o};

let qSeq=0;
async function refresh(){
  const c=count(), sub=subtotal();
  if(!c){ $('quote').innerHTML=''; $('barHint').textContent='还没选菜'; $('submit').disabled=true; $('tot').textContent='$0.00'; return; }
  // 自取模式：金额全由后端算（税 + 小费）；没回来之前先显示小计
  $('tot').textContent=money(sub);
  if(!backend){ msg('err','暂时连不上店里服务器，请稍后再试，或直接打电话订餐。'); $('submit').disabled=true; $('quote').innerHTML=''; return; }
  const seq=++qSeq;
  let q;
  try{
    const u=`${backend}/api/quote?subtotal=${subtotal()}&tip_rate=${Math.max(0,tipRate)}&pickup=1`;
    q=await fetch(u).then(r=>r.json());
  }catch(e){ q={ok:false,error:'连不上店里服务器，请稍后再试，或直接打电话订餐。'}; }
  if(seq!==qSeq) return;
  Q=q;
  // 只有后端真的算出合计才显示合计，否则显示小计（绝不是 $0.00 假合计）
  $('tot').textContent=(q&&q.ok&&Number.isFinite(+q.total))?money(q.total):money(sub);
  $('quote').innerHTML=rows(q,sub);
  const probs=[];
  if(q.ok===false) probs.push(['err',q.error]);
  $('msgs').innerHTML=probs.map(p=>`<div class="msg ${p[0]}">${p[1]}</div>`).join('');
  $('submit').disabled=!q.ok||c===0;
  $('barHint').textContent=`${c} 件 · 到店自取`;
}
function rows(q,sub){
  const r=[`<div class="r"><span>小计</span><span>${money(q.subtotal!=null?q.subtotal:sub)}</span></div>`];
  if(q.tax) r.push(`<div class="r"><span>税 ${(q.tax_rate*100).toFixed(3)}%</span><span>${money(q.tax)}</span></div>`);
  if(q.tip) r.push(`<div class="r"><span>小费 ${Math.round(tipRate*100)}%</span><span>${money(q.tip)}</span></div>`);
  r.push((q&&q.ok&&Number.isFinite(+q.total))
    ? `<div class="r tot"><span>合计（到店现金付款）</span><span>${money(q.total)}</span></div>`
    : `<div class="r tot"><span>合计（到店现金付款）</span><span>待后端计算</span></div>`);
  return r.join('');
}

$('submit').onclick=async()=>{
  $('submit').disabled=true; $('submit').textContent='提交中…';
  const body={items:items(),pickup:true,customer:$('cust').value.trim(),phone:$('phone').value.trim(),
    remark:$('remark').value.trim(),tip_rate:Math.max(0,tipRate),pay_type:(cfg&&cfg.payment&&cfg.payment[0])||PAY_DEFAULT,
    address:'',source:'pages-delivery'};
  let order=null,printMsg='';
  if(!backend){
    $('msgs').innerHTML='<div class="msg err">暂时连不上店里服务器，无法下单；请稍后再试，或直接打电话订餐。</div>';
    $('submit').disabled=false; $('submit').textContent='下单'; return;
  }
  if(backend){
    try{
      const r=await fetch(backend+'/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(x=>x.json());
      if(!r.ok){ $('msgs').innerHTML=`<div class="msg err">${r.error||'下单失败'}</div>`; $('submit').disabled=false; $('submit').textContent='下单'; return; }
      order=r.order; printMsg=r.print&&r.print.ok?`小票已打印（${r.print.driver}）`:`打印未成功：${(r.print&&(r.print.error||r.print.mode))||'未知'}`;
    }catch(e){ $('msgs').innerHTML='<div class="msg err">下单没成功：连不上店里服务器，请重试或直接打电话订餐。</div>'; $('submit').disabled=false; $('submit').textContent='下单'; return; }
  }else{
    printMsg='（这家店还没接打印机：小票没出，请把订单号告诉店员。）';
  }
  $('doneNo').textContent='订单号 '+order.no;
  $('doneMsg').textContent=`${printMsg} 请到店取餐，备好现金 ${money(order.total)}。`;
  $('doneRcpt').textContent=WXMenu.renderReceipt(order,{name:SHOP.name,slogan:SHOP.slogan,phone:SHOP.phone,footer:'谢谢惠顾|现金支付'},32);
  saveCustomer({name:body.customer,phone:body.phone});
  $('done').classList.add('show');
};
// ---- 老客取回 + 记住上次填的资料 ----
// 方案：手机号当钥匙，不做验证（店里定的）。所以只回姓名/最近地址/来过次数/上一单的菜。
const LS='wx_customer';
const savedCustomer=()=>{try{return JSON.parse(localStorage.getItem(LS)||'null')||{}}catch(e){return{}}};
const saveCustomer=(o)=>{try{localStorage.setItem(LS,JSON.stringify(o))}catch(e){}};

function prefillSaved(){
  const s=savedCustomer();
  if(s.phone&&!$('phone').value)   $('phone').value=s.phone;
  if(s.name&&!$('cust').value)     $('cust').value=s.name;
  if(s.phone) $('rp').value=s.phone;
}

function addLastToCart(items){
  let ok=0,gone=[];
  (items||[]).forEach(it=>{
    const inMenu=MENU.some(g=>g.items.some(x=>x.id===it.id));
    if(inMenu){cart[it.id]=Math.max(1,Number(it.qty)||1);ok++}else gone.push(it.name||it.id);
  });
  renderMenu();refresh();
  return {ok,gone};
}

async function recall(){
  const p=$('rp').value.trim();
  $('rmsg').textContent='查询中…'; $('rlast').innerHTML='';
  if(!backend){$('rmsg').textContent='暂时连不上店里服务器，稍后再试或直接打电话订。';return}
  try{
    const r=await fetch(backend+'/api/lookup',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({phone:p})}).then(x=>x.json());
    if(!r.ok){$('rmsg').textContent=r.error||'查不到，请直接填资料。';return}
    if(!r.found){$('rmsg').textContent='这个号码还没有下过单，直接填资料就行。';return}
    if(!$('cust').value) $('cust').value=r.name||'';
    $('phone').value=p;
    $('rmsg').textContent=`欢迎回来，${r.name||'老客'}：这个号码来过 ${r.orders} 次`
      + (r.last_at?`，上次 ${String(r.last_at).replace('T',' ').slice(0,16)}`:'') + '。';
    const li=(r.last_order&&r.last_order.items)||[];
    if(li.length){
      $('rlast').innerHTML='<div class="hint" style="margin-top:6px">上次点的：'
        +li.map(i=>`${i.name}×${i.qty}`).join('、')
        +`  <button type="button" id="rone" style="padding:2px 10px;margin-left:6px">再来一单</button></div>`;
      $('rone').onclick=()=>{const res=addLastToCart(li);
        $('rmsg').textContent=`已加入购物车 ${res.ok} 道菜`
          +(res.gone.length?`；这些现在没有：${res.gone.join('、')}`:'' )+'。';};
    }
    saveCustomer({name:$('cust').value.trim(),phone:p});
  }catch(e){$('rmsg').textContent='查询失败：连不上店里服务器。'}
}

$('rbtn').onclick=recall;
$('rp').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();recall()}});
prefillSaved();

boot();
</script>
</body>
</html>
