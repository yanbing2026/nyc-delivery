<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>店铺设置（店员用）</title>
<style>
  :root{--bg:#111417;--card:#181d22;--line:#2a3239;--fg:#e8edf2;--dim:#93a1ad;--ok:#3ec46d;--err:#ff6b6b;--acc:#3b82f6}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  header{padding:16px;border-bottom:1px solid var(--line);background:var(--card)}
  h1{margin:0;font-size:18px}
  h2{margin:0 0 10px;font-size:15px;color:#cdd8e3}
  .wrap{padding:14px;max-width:900px;margin:0 auto}
  .block{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
  label{display:block;font-size:12px;color:var(--dim);margin:8px 0 3px}
  input,select{width:100%;padding:8px 9px;background:#0e1215;color:var(--fg);border:1px solid var(--line);border-radius:7px;font:14px inherit}
  input.num{width:110px}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
  .row>div{flex:1;min-width:130px}
  button{cursor:pointer;border:0;border-radius:7px;padding:9px 13px;font:14px inherit;background:var(--acc);color:#fff}
  button.gray{background:#2b3238}
  button.tiny{padding:4px 8px;font-size:12px;background:#2b3238}
  .hint{color:var(--dim);font-size:12px;margin-top:6px}
  .cat{border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:10px;background:#141a1f}
  .item{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}
  .item>div{flex:1;min-width:92px}
  #status,#lockStatus{margin-top:10px;font-size:13px;white-space:pre-wrap}
  .ok{color:var(--ok)} .err{color:var(--err)}
  a{color:var(--acc)}
</style>
</head>
<body>
<header><h1>店铺设置（店员用）</h1></header>
<div class="wrap">

  <!-- 门锁：没验过口令之前，下面那份表单根本不渲染（数据也不会去后端取） -->
  <div class="block" id="lockBox">
    <h2>🔒 先验口令</h2>
    <div class="row">
      <div><label>后端地址</label><input id="backend" placeholder="https://xxx.workers.dev"></div>
      <div><label>口令</label><input id="key" type="password" placeholder="店里给你的口令"></div>
    </div>
    <div class="row" style="margin-top:10px">
      <div style="flex:0"><button onclick="unlock()">进入后台</button></div>
    </div>
    <div id="lockStatus"></div>
    <div class="hint">口令由服务器校验（服务器不认就是进不去，页面里没有密码可猜）。只在你这台浏览器里记着，不写进网页，也不会跟着网页发给别人。</div>
  </div>

  <div id="panel" style="display:none">
    <div class="block">
      <h2>已连接：<span id="whoBackend"></span></h2>
      <div class="row">
        <div style="flex:0"><button onclick="load()">重新读取</button></div>
        <div style="flex:0"><button class="gray" onclick="save()">保存到服务器</button></div>
        <div style="flex:0"><button class="gray" onclick="lock()">锁定 / 换口令</button></div>
      </div>
      <div id="status"></div>
    </div>

    <div class="block">
      <h2>① 店名 / 电话（顾客点单页页头显示的就是这些）</h2>
      <div class="row">
        <div><label>店名</label><input id="shop_name"></div>
        <div><label>电话</label><input id="shop_phone"></div>
      </div>
      <label>口号 / 一句话（可留空）</label><input id="shop_slogan">
    </div>

    <div class="block">
      <h2>② 配送费规则</h2>
      <div class="row">
        <div><label>店址（英文，改完会自动重新解析坐标）</label><input id="r_addr"></div>
      </div>
      <div class="row" style="margin-top:6px">
        <div style="flex:0"><label>多少英里内免费</label><input class="num" id="r_free"></div>
        <div style="flex:0"><label>超出每英里加 $</label><input class="num" id="r_per_mile"></div>
        <div style="flex:0"><label>起送 $</label><input class="num" id="r_min"></div>
        <div style="flex:0"><label>税率 %</label><input class="num" id="r_tax"></div>
      </div>
      <div class="hint">规则由服务器执行：点单页只显示算好的金额，改完立刻生效。只送纽约五大区。</div>
    </div>

    <div class="block">
      <h2>③ 菜单（名字 / 英文名 / 说明 / 价格）</h2>
      <div id="menu"></div>
      <button class="gray" onclick="addCat()">+ 加一个分类</button>
      <div class="hint">改价只改这里 —— 下单时服务器按菜单里的价格重算，页面上改的价不作数，避免"页面一个价、后厨另一个价"。</div>
    </div>

    <div class="block">
      <h2>④ 看效果</h2>
      <a id="preview" href="./" target="_blank">打开顾客点单页 →</a>
      <div class="hint">顾客看到的店名 / 菜名 / 价格 / 运费，全都来自你在这里保存的内容。</div>
    </div>
  </div>

</div>
<script>
const $ = (id) => document.getElementById(id);
const WORKER = 'https://nyc-delivery-orders.yanbing2004.workers.dev';
let model = { shop: { name: '', phone: '', slogan: '' }, menu: [], delivery: {} };
let nextId = 0;
let unlocked = false;

const status = (k, t) => { const s = $('status'); if (!s) return; s.className = k || ''; s.textContent = t || ''; };
const lockStatus = (k, t) => { const s = $('lockStatus'); if (!s) return; s.className = k || ''; s.textContent = t || ''; };
const num = (id, dflt) => { const v = parseFloat($(id).value); return Number.isFinite(v) ? v : dflt; };

function base() { return ($('backend').value || WORKER).replace(/\/+$/, ''); }
function key() { return $('key').value.trim(); }

/* ---------- 门锁 ---------- */
async function unlock() {
  const k = key();
  if (!k) { lockStatus('err', '先填口令。'); return; }
  lockStatus('', '正在验口令…');
  try {
    const r = await fetch(base() + '/api/report/verify', { headers: { 'X-Agent-Key': k } }).then((x) => x.json());
    if (!r.ok) { lockStatus('err', '口令不对，进不去。（服务器说：' + (r.error || '拒绝') + '）'); return; }
    if (r.who !== undefined && r.ok) { /* 通过 */ }
    applyUnlocked();
  } catch (e) {
    // 有的自建后端没有这个接口；真伪最终由"保存"这一步服务端再验一次
    if (String(e.message || e).includes('404') || /no such/i.test(String(e.message || e))) {
      lockStatus('err', '这台后端没有验口令接口（不是 Cloudflare Worker 后端）。先按当前口令进入，保存时服务器还会再验一次。');
      applyUnlocked();
      return;
    }
    lockStatus('err', '连不上后端：' + (e.message || e));
  }
}

function applyUnlocked() {
  unlocked = true;
  localStorage.setItem('wxmenu_agentkey', key());
  localStorage.setItem('wxmenu_backend', base());
  $('lockBox').style.display = 'none';
  $('panel').style.display = '';
  const w = $('whoBackend'); if (w) w.textContent = base();
  load();
}

function lock() {
  unlocked = false;
  localStorage.removeItem('wxmenu_agentkey');
  model = { shop: { name: '', phone: '', slogan: '' }, menu: [], delivery: {} };
  $('key').value = '';
  $('panel').style.display = 'none';
  $('lockBox').style.display = '';
  lockStatus('ok', '已锁定，口令从这台浏览器里清掉了。');
}

/* ---------- 读 / 存 ---------- */
async function load() {
  if (!unlocked) return;
  status('', '正在读…');
  try {
    const c = await fetch(base() + '/api/config').then((r) => r.json());
    if (!c.ok) throw new Error(c.error || '读不到配置');
    model.shop = c.shop || { name: '', phone: '', slogan: '' };
    model.menu = Array.isArray(c.menu) ? JSON.parse(JSON.stringify(c.menu)) : [];
    model.delivery = c.config || {};
    $('shop_name').value = model.shop.name || '';
    $('shop_phone').value = model.shop.phone || '';
    $('shop_slogan').value = model.shop.slogan || '';
    $('r_addr').value = model.delivery.restaurant_addr || '';
    $('r_free').value = model.delivery.free_miles ?? '';
    $('r_per_mile').value = model.delivery.per_mile_beyond ?? '';
    $('r_min').value = model.delivery.min_order ?? '';
    $('r_tax').value = model.delivery.tax_rate != null ? (model.delivery.tax_rate * 100).toFixed(3).replace(/\.?0+$/, '') : '';
    renderMenu();
    status('ok', '已读取：' + (model.shop.name || '(没店名)') + ' · 菜单 ' + model.menu.length + ' 个分类');
  } catch (e) {
    status('err', '读不到：' + (e.message || e));
  }
}

function renderMenu() {
  const box = $('menu'); box.innerHTML = '';
  model.menu.forEach((cat, ci) => {
    const d = document.createElement('div'); d.className = 'cat';
    d.innerHTML = '<div class="row"><div style="flex:1"><label>分类名</label>' +
      '<input id="c_name_' + ci + '" value="' + esc(cat.name) + '"></div>' +
      '<div style="flex:0"><button class="gray tiny" onclick="addItem(' + ci + ')">+ 加菜</button></div>' +
      '<div style="flex:0"><button class="gray tiny" onclick="delCat(' + ci + ')">删分类</button></div></div>';
    cat.items.forEach((it, ii) => {
      const r = document.createElement('div'); r.className = 'item';
      r.innerHTML =
        '<div><label>菜名</label><input id="i_name_' + ci + '_' + ii + '" value="' + esc(it.name) + '"></div>' +
        '<div><label>英文名</label><input id="i_en_' + ci + '_' + ii + '" value="' + esc(it.en) + '"></div>' +
        '<div><label>说明</label><input id="i_desc_' + ci + '_' + ii + '" value="' + esc(it.desc) + '"></div>' +
        '<div style="flex:0"><label>价格 $</label><input class="num" id="i_price_' + ci + '_' + ii + '" value="' + it.price + '"></div>' +
        '<div style="flex:0"><label>编号</label><input class="num" id="i_id_' + ci + '_' + ii + '" value="' + esc(it.id) + '"></div>' +
        '<div style="flex:0"><button class="gray tiny" onclick="delItem(' + ci + ',' + ii + ')">删</button></div>';
      d.appendChild(r);
    });
    box.appendChild(d);
  });
}

// 用户输入要进 innerHTML，转义一下（菜名里有引号/尖括号不至于把页面搞坏）
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

function newId() { return 'n' + Date.now().toString(36) + (nextId++); }   // 历史订单按编号存档，编号必须唯一且稳定
function addCat() { collect(); model.menu.push({ name: '新分类', items: [{ id: newId(), name: '新菜', en: '', desc: '', price: 10 }] }); renderMenu(); }
function delCat(ci) { collect(); model.menu.splice(ci, 1); renderMenu(); }
function addItem(ci) { collect(); model.menu[ci].items.push({ id: newId(), name: '新菜', en: '', desc: '', price: 10 }); renderMenu(); }
function delItem(ci, ii) { collect(); model.menu[ci].items.splice(ii, 1); renderMenu(); }

// 从输入框收回当前编辑内容（增删/保存前都要调，否则重新渲染会把用户刚打的字冲掉）
function collect() {
  const shop = { name: $('shop_name').value.trim(), phone: $('shop_phone').value.trim(), slogan: $('shop_slogan').value.trim() };
  const menu = model.menu.map((cat, ci) => ({
    name: ($('c_name_' + ci) ? $('c_name_' + ci).value : cat.name).trim(),
    items: cat.items.map((it, ii) => {
      const g = (p, d) => { const el = $('i_' + p + '_' + ci + '_' + ii); return el && el.value !== undefined ? el.value : d; };
      // 这里不丢任何一行：用户正在改的行不能在渲染时消失，坏数据交给 problems() 报错
      return { id: String(g('id', it.id)).trim(), name: String(g('name', it.name)).trim(), en: String(g('en', it.en)).trim(),
        desc: String(g('desc', it.desc)).trim(), price: parseFloat(g('price', it.price)) };
    }),
  }));
  model.shop = shop; model.menu = menu;
  return { shop, menu };
}

// 保存前本地先挑错：坏行留在界面上让人改，而不是悄悄丢掉、或者把 $0 的菜发上去
function problems(menu) {
  const errs = [], seen = new Set();
  if (!menu.length) errs.push('菜单是空的，至少留一个分类和一道菜');
  menu.forEach((cat, ci) => {
    if (!cat.name) errs.push('第 ' + (ci + 1) + ' 个分类没有名字');
    if (!cat.items.length) errs.push('第 ' + (ci + 1) + ' 个分类里没有菜');
    cat.items.forEach((it, ii) => {
      const at = '第 ' + (ci + 1) + ' 个分类的第 ' + (ii + 1) + ' 道菜';
      if (!it.id) errs.push(at + '没有编号');
      else if (seen.has(it.id)) errs.push(at + '的编号跟别的菜重复：' + it.id);
      else seen.add(it.id);
      if (!it.name) errs.push(at + '没有名字');
      if (!Number.isFinite(it.price) || it.price < 0 || it.price > 999) errs.push(at + '的价格要填 0~999 之间的数字');
    });
  });
  return errs;
}

async function save() {
  if (!unlocked) { lockStatus('err', '先验口令。'); return; }
  const k = key();
  if (!k) { status('err', '口令没了，请重新锁定再进一次。'); return; }
  const { shop, menu } = collect();
  const bad = problems(menu);
  if (bad.length) { status('err', '还没存，先改好这几处：\n' + bad.join('\n')); return; }
  const body = {
    shop, menu,
    restaurant_addr: $('r_addr').value.trim(),
    free_miles: num('r_free', model.delivery.free_miles ?? 5),
    per_mile_beyond: num('r_per_mile', model.delivery.per_mile_beyond ?? 2),
    min_order: num('r_min', model.delivery.min_order ?? 20),
    tax_rate: num('r_tax', (model.delivery.tax_rate ?? 0.08875) * 100) / 100,
    max_miles: 0,
  };
  if (!body.tax_rate && model.delivery.tax_rate) body.tax_rate = model.delivery.tax_rate;
  status('', '正在保存…');
  try {
    const r = await fetch(base() + '/api/report/settings', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Agent-Key': k }, body: JSON.stringify(body),
    }).then((x) => x.json());
    if (!r.ok) { status('err', '没存上：' + (r.error || '服务器拒绝')); if (/口令|key/.test(r.error || '')) lock(); return; }
    model.shop = r.shop || shop; model.menu = r.menu || menu;
    renderMenu();
    status('ok', '已保存并生效：' + (model.shop.name || '') + ' · 菜单 ' + model.menu.length + ' 个分类，'
      + model.menu.reduce((s, c) => s + c.items.length, 0) + ' 道菜');
  } catch (e) {
    status('err', '没存上：' + (e.message || e));
  }
}

function boot() {
  $('backend').value = localStorage.getItem('wxmenu_backend') || WORKER;
  $('key').value = localStorage.getItem('wxmenu_agentkey') || '';
  if ($('key').value) unlock();      // 本机存过口令就直接进，不用每次重填
  else lockStatus('', '填口令后进后台。');
}
boot();
</script>
</body>
</html>
